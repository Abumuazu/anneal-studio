name: Update visual baselines

# Visual snapshots are per platform. CI compares against the linux set, which
# this workflow generates and commits to the branch it runs on. Run it after an
# intended visual change, then review the committed images in the PR diff.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anneal/site exec playwright install --with-deps chromium
      - run: pnpm --filter @anneal/site build
      - run: pnpm --filter @anneal/site exec playwright test --project=visual --update-snapshots
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/anneal/e2e/__snapshots__/linux
          git diff --cached --quiet || git commit -m "Update linux visual baselines"
          git push

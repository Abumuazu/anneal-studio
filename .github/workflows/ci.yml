name: CI

on:
  workflow_dispatch:
    inputs:
      focus_performance:
        description: Profile Home, Work and Wisp without repeating the browser suite
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The template's demo site must keep building from the kit (M7).
      - run: pnpm --filter @sites/demo build

  e2e:
    name: Playwright (smoke, axe, visual)
    if: ${{ !inputs.focus_performance }}
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anneal/site exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @anneal/site build
      - run: pnpm --filter @anneal/site test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/anneal/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anneal/site build
      - run: pnpm lhci
        env:
          LHCI_FOCUS: ${{ inputs.focus_performance && 'launch' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: apps/anneal/.lighthouseci/reports
          retention-days: 14
